<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Photos - Photo Wall</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f1117;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.9rem;
      color: #8a8f9d;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #c0c4d0;
    }

    .file-dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 26px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
    }

    .file-dropzone:hover {
      border-color: #ff4b2b;
      background: rgba(255, 75, 43, 0.05);
    }

    .file-dropzone input[type="file"] {
      display: none;
    }

    .file-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .file-label {
      font-size: 0.95rem;
      color: #d0d4e0;
      word-break: break-all;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #ff4b2b;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 0 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.95;
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.error {
      display: block;
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid rgba(255, 75, 75, 0.4);
      color: #ff6b6b;
    }

    .status-msg.info {
      display: block;
      background: rgba(75, 150, 255, 0.15);
      border: 1px solid rgba(75, 150, 255, 0.4);
      color: #6bb0ff;
    }

    .success-view {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-view .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .success-view h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .success-view p {
      font-size: 0.9rem;
      color: #8a8f9d;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="uploadView">
      <div class="header">
        <h1>📷 Share Your Photos</h1>
        <p>Select one or multiple photos to display on the live wall.</p>
      </div>

      <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group">
          <label>Select Photo(s)</label>
          <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
            <div class="file-icon">🖼️</div>
            <div id="fileLabel" class="file-label">Tap to choose photos (multi-select supported)</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple onchange="updateFileLabel()">
          </div>
        </div>

        <div class="form-group">
          <label for="captionInput">Caption (optional, max 80 chars)</label>
          <input type="text" id="captionInput" maxlength="80" placeholder="e.g. Having fun at the workshop!">
        </div>

        <div class="form-group">
          <label for="locationInput">Photo Location / Place (optional)</label>
          <div class="input-row">
            <input type="text" id="locationInput" maxlength="60" placeholder="e.g. Paris, Beach, Workshop">
            <button type="button" class="btn-secondary" onclick="detectGPSLocation()">📍 GPS</button>
          </div>
        </div>

        <div class="form-group">
          <label for="roomIdInput">Destination Room / Folder</label>
          <input type="text" id="roomIdInput" maxlength="40" placeholder="public (or enter Private Room ID)">
        </div>

        <button type="submit" id="submitBtn" class="btn" disabled>Upload Photos</button>
      </form>

      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div id="successView" class="success-view">
      <div class="icon">🚀</div>
      <h2 id="successTitle">Photos Uploaded!</h2>
      <p id="successDesc">Your photos have been uploaded and will appear on the wall shortly.</p>
      <button class="btn" onclick="resetForm()">Upload More Photos</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const captionInput = document.getElementById('captionInput');
    const locationInput = document.getElementById('locationInput');
    const roomIdInput = document.getElementById('roomIdInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const uploadView = document.getElementById('uploadView');
    const successView = document.getElementById('successView');
    const successTitle = document.getElementById('successTitle');
    const successDesc = document.getElementById('successDesc');

    function updateFileLabel() {
      const files = fileInput.files;
      if (files && files.length > 0) {
        if (files.length === 1) {
          const file = files[0];
          fileLabel.textContent = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
          submitBtn.textContent = 'Upload Photo';
        } else {
          let totalBytes = 0;
          for (let i = 0; i < files.length; i++) totalBytes += files[i].size;
          fileLabel.textContent = `📁 ${files.length} photos selected (${(totalBytes / (1024 * 1024)).toFixed(2)} MB total)`;
          submitBtn.textContent = `Upload ${files.length} Photos`;
        }
        submitBtn.disabled = false;
        hideStatus();
      } else {
        fileLabel.textContent = 'Tap to choose photos (multi-select supported)';
        submitBtn.textContent = 'Upload Photos';
        submitBtn.disabled = true;
      }
    }

    function detectGPSLocation() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      showStatus('Fetching GPS location...', 'info');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(3);
          const lng = pos.coords.longitude.toFixed(3);
          locationInput.value = `GPS: ${lat}, ${lng}`;
          showStatus(`Location set to GPS: ${lat}, ${lng}`, 'info');
        },
        () => {
          showStatus('Could not access GPS location.', 'error');
        }
      );
    }

    function showStatus(text, type = 'info') {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg ${type}`;
    }

    function hideStatus() {
      statusMsg.className = 'status-msg';
      statusMsg.textContent = '';
    }

    function compressImage(file, maxDimension = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        if (file.size < 300 * 1024 || file.type === 'image/gif') {
          return resolve(file);
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(
              (blob) => {
                if (blob && blob.size < file.size) {
                  const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                    type: 'image/jpeg',
                    lastModified: Date.now()
                  });
                  resolve(compressedFile);
                } else {
                  resolve(file);
                }
              },
              'image/jpeg',
              quality
            );
          };
          img.onerror = () => resolve(file);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    async function uploadSingleFile(rawFile, caption, location, roomId) {
      const file = await compressImage(rawFile);

      const presignRes = await fetch('/api/presign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contentType: file.type,
          caption: caption,
          location: location,
          roomId: roomId
        })
      });

      if (!presignRes.ok) {
        const errData = await presignRes.json().catch(() => ({}));
        throw new Error(errData.error || 'Failed to get upload authorization.');
      }

      const presignData = await presignRes.json();
      const { url, key, headers } = presignData;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: headers,
        body: file
      });

      if (!putRes.ok) {
        throw new Error(`S3 upload failed for "${file.name}" (status ${putRes.status}).`);
      }

      const completeRes = await fetch('/api/complete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key })
      });

      if (!completeRes.ok) {
        const errData = await completeRes.json().catch(() => ({}));
        throw new Error(errData.error || 'Thumbnail generation failed.');
      }
    }

    async function handleUpload(event) {
      event.preventDefault();
      const files = Array.from(fileInput.files);
      if (!files.length) return;

      const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
      for (const file of files) {
        if (!allowedTypes.includes(file.type.toLowerCase())) {
          showStatus(`"${file.name}" is not a valid JPEG, PNG, GIF, or WebP image.`, 'error');
          return;
        }
      }

      submitBtn.disabled = true;
      const total = files.length;
      let completed = 0;

      showStatus(`Optimizing and uploading ${total} ${total === 1 ? 'photo' : 'photos'}...`, 'info');

      try {
        const caption = captionInput.value;
        const location = locationInput.value;
        const roomId = roomIdInput.value.trim().toLowerCase() || 'public';

        const uploadPromises = files.map(async (file) => {
          await uploadSingleFile(file, caption, location, roomId);
          completed++;
          showStatus(`Uploaded ${completed} of ${total} photos...`, 'info');
        });

        await Promise.all(uploadPromises);

        if (total === 1) {
          successTitle.textContent = 'Photo Uploaded!';
          successDesc.textContent = 'Your photo was uploaded successfully!';
        } else {
          successTitle.textContent = `${total} Photos Uploaded!`;
          successDesc.textContent = `All ${total} photos were uploaded successfully!`;
        }

        uploadView.style.display = 'none';
        successView.style.display = 'block';

      } catch (err) {
        showStatus(`Error: ${err.message || 'Failed to upload photo.'}`, 'error');
        submitBtn.disabled = false;
      }
    }

    function resetForm() {
      fileInput.value = '';
      captionInput.value = '';
      locationInput.value = '';
      updateFileLabel();
      hideStatus();
      successView.style.display = 'none';
      uploadView.style.display = 'block';
    }
  </script>
</body>
</html>
